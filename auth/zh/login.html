<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>登录 — Hanes Distribution</title>
<meta name="description" content="登录 Hanes Distribution：适用于供应商、合作伙伴、客户和 Hanes 员工。">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/auth/auth.css">
<script type="module" src="/auth/auth.js"></script>
</head>
<body class="auth-page" data-page="login">
<a class="auth__skip" href="#main">跳至表单</a>

<header class="gb" id="gb">
  <nav class="gb__in" aria-label="Hanes Distribution">
    <a class="gb__logo" href="/">Hanes <span>Distribution</span></a>
    <a class="gb__back" href="/"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 1L3 5l4 4"/></svg>返回网站</a>
  </nav>
</header>

<main class="auth" id="main" tabindex="-1">
  <section class="auth__card" aria-labelledby="title">
    <div class="auth__top"><p class="auth__eyebrow">Hanes Distribution</p><a class="auth__lang" id="langSwitch" href="/auth/login.html" hreflang="en-NZ" lang="en-NZ">English</a></div>
    <h1 id="title">登录</h1>
    <p class="auth__sub" id="sub">适用于供应商、合作伙伴、客户和 Hanes&nbsp;员工。</p>
    <p class="auth__note" id="notice" role="status" tabindex="-1">正在准备登录…</p>
    <noscript><p class="auth__alert">登录需要 JavaScript。请启用后刷新此页面。</p></noscript>
    <p class="auth__alert" id="alert" role="alert" tabindex="-1" hidden></p>
    <p class="auth__done" id="done" role="status" tabindex="-1" hidden></p>
    <form class="auth__form" id="form" method="post" novalidate hidden>
      <div class="auth__field">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" maxlength="254" required>
      </div>
      <div class="auth__field">
        <label for="password">密码</label>
        <div class="auth__pw">
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="72" required>
          <button class="auth__show" type="button" aria-controls="password" aria-label="显示密码">显示</button>
        </div>
      </div>
      <label class="auth__check"><input id="remember" name="remember" type="checkbox" aria-describedby="remember-help"><span>在此设备上保持登录</span></label>
      <p class="auth__help" id="remember-help">关闭浏览器后将自动退出登录。部分浏览器恢复标签页时会保持登录状态；使用公用电脑时，请手动“退出登录”。</p>
      <div class="auth__captcha" id="captcha"></div>
      <button class="auth__go" type="submit">登录</button>
      <p class="auth__links"><a href="/auth/zh/reset.html">忘记密码？</a></p>
    </form>
    <div id="resendBox" hidden><button class="auth__linkbtn" id="resend" type="button">重新发送验证邮件</button></div>
    <div id="retryBox" hidden><button class="auth__go" id="retry" type="button">重试</button></div>
    <p class="auth__alt">账户仅限受邀开通。尚未收到邀请？<a href="/contact.html#enquiry" hreflang="en-NZ">请联系我们</a></p>
    <div id="setupHelp" hidden>
      <p class="auth__links"><a href="/contact.html#enquiry" hreflang="en-NZ">联系我们咨询</a><a href="/bargainhub.html" hreflang="en-NZ">关于 Bargainhub</a></p>
    </div>
  </section>
</main>

<footer class="gf">
  <div class="gf__in">
    <div class="gf__base"><span>© 2026 Hanes Distribution 保留所有权利。</span><span class="gf__links"><a href="/privacy.html" hreflang="en-NZ">隐私</a><a href="/contact.html" hreflang="en-NZ">联系我们</a></span></div>
  </div>
</footer>
</body>
</html>

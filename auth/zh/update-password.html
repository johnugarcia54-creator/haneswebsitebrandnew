<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>设置新密码 — Hanes Distribution</title>
<meta name="description" content="为您的 Hanes Distribution 账户设置新密码。保存后，您仅在此设备上保持登录。">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/auth/auth.css">
<script type="module" src="/auth/auth.js"></script>
</head>
<body class="auth-page" data-page="update-password">
<a class="auth__skip" href="#main">跳至表单</a>

<header class="gb" id="gb">
  <nav class="gb__in" aria-label="Hanes Distribution">
    <a class="gb__logo" href="/">Hanes <span>Distribution</span></a>
    <a class="gb__back" href="/"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 1L3 5l4 4"/></svg>返回网站</a>
  </nav>
</header>

<main class="auth" id="main" tabindex="-1">
  <section class="auth__card" aria-labelledby="title">
    <div class="auth__top"><p class="auth__eyebrow">Hanes Distribution</p><a class="auth__lang" id="langSwitch" href="/auth/update-password.html" hreflang="en-NZ" lang="en-NZ">English</a></div>
    <h1 id="title">设置新密码</h1>
    <p class="auth__sub" id="sub">保存后，您仅在此设备上保持登录。</p>
    <p class="auth__note" id="notice" role="status" tabindex="-1">正在准备登录…</p>
    <noscript><p class="auth__alert">登录需要 JavaScript。请启用后刷新此页面。</p></noscript>
    <p class="auth__alert" id="alert" role="alert" tabindex="-1" hidden></p>
    <p class="auth__done" id="done" role="status" tabindex="-1" hidden></p>
    <form class="auth__form" id="form" method="post" novalidate hidden>
      <div class="auth__field">
        <label for="password">新密码</label>
        <div class="auth__pw">
          <input id="password" name="password" type="password" autocomplete="new-password" maxlength="72" data-min="12" aria-describedby="password-help" required>
          <button class="auth__show" type="button" aria-controls="password" aria-label="显示密码">显示</button>
        </div>
        <p class="auth__help" id="password-help">12 至 72 个字符。建议使用几个词语组合，既好记又安全。</p>
      </div>
      <button class="auth__go" type="submit">保存</button>
    </form>
    <p hidden><a class="auth__go" id="continue" href="/studio/">继续</a></p>
    <div id="retryBox" hidden><button class="auth__go" id="retry" type="button">重试</button></div>
    <div id="linkHelp" hidden>
      <p class="auth__links"><a href="/auth/zh/reset.html">获取新的重置链接</a><a href="/auth/zh/login.html">登录</a></p>
    </div>
    <div id="linkHelpInvite" hidden>
      <p class="auth__help">如需新的邀请，请联系邀请您的人。</p>
      <p class="auth__links"><a href="/contact.html#enquiry" hreflang="en-NZ">联系我们</a><a href="/auth/zh/login.html">登录</a></p>
    </div>
    <div id="setupHelp" hidden>
      <p class="auth__links"><a href="/contact.html#enquiry" hreflang="en-NZ">联系我们咨询</a><a href="/bargainhub.html" hreflang="en-NZ">关于 Bargainhub</a></p>
    </div>
  </section>
</main>

<footer class="gf">
  <div class="gf__in">
    <div class="gf__base"><span>© 2026 Hanes Distribution 保留所有权利。</span><span class="gf__links"><a href="/privacy.html" hreflang="en-NZ">隐私</a><a href="/contact.html" hreflang="en-NZ">联系我们</a></span></div>
  </div>
</footer>
</body>
</html>

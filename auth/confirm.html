<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Confirm — Bargainhub studio</title>
<meta name="description" content="Confirm your email address for the Bargainhub studio.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/auth/auth.css">
<script src="/vendor/supabase-js-2.117.3.min.js" defer></script>
<script type="module" src="/auth/auth.js"></script>
</head>
<body class="auth-page" data-page="confirm">
<a class="auth__skip" href="#main">Skip to the form</a>

<header class="gb" id="gb">
  <nav class="gb__in" aria-label="Hanes Distribution">
    <a class="gb__logo" href="/">Hanes <span>Distribution</span></a>
    <a class="gb__back" href="/"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M7 1L3 5l4 4"/></svg>Back to the site</a>
  </nav>
</header>

<main class="auth" id="main" tabindex="-1">
  <section class="auth__card" aria-labelledby="title">
    <p class="auth__eyebrow">Bargainhub studio</p>
    <h1 id="title">Confirm</h1>
    <p class="auth__sub" id="sub">Press Confirm to continue.</p>
    <p class="auth__note" id="notice" role="status" tabindex="-1">Getting sign-in ready…</p>
    <noscript><p class="auth__alert">Sign-in needs JavaScript. Switch it on, then reload this page.</p></noscript>
    <p class="auth__alert" id="alert" role="alert" tabindex="-1" hidden></p>
    <p class="auth__done" id="done" role="status" tabindex="-1" hidden></p>
    <form class="auth__form" id="form" novalidate hidden>
      <div id="inviteAck" hidden>
        <label class="auth__check"><input id="privacy" name="privacy" type="checkbox" data-required="Tick “I've read the privacy statement” to continue."><span>I've read the <a href="/privacy.html">privacy statement</a>.</span></label>
      </div>
      <button class="auth__go" type="submit">Confirm</button>
    </form>
    <div id="retryBox" hidden><button class="auth__go" id="retry" type="button">Retry</button></div>
    <div id="linkHelp" hidden>
      <p class="auth__links"><a href="/auth/reset.html">Ask for a new reset link</a><a href="/auth/login.html">Sign in</a></p>
    </div>
    <div id="setupHelp" hidden>
      <p class="auth__links"><a href="/contact.html#enquiry">Send us an enquiry</a><a href="/bargainhub.html">About Bargainhub</a></p>
    </div>
  </section>
</main>

<footer class="gf">
  <div class="gf__in">
    <div class="gf__base"><span>© 2026 Hanes Distribution</span><span class="gf__links"><a href="/privacy.html">Privacy</a><a href="/contact.html">Contact</a></span></div>
  </div>
</footer>
</body>
</html>

<!doctype html>
<!-- The 1200 x 630 sharing card (og:image, twitter:image), rendered by scripts/og-cards.mjs from
     og/cards.json. Only the site's own photo and fonts; nothing is generated. -->
<html lang="en-NZ">
<meta charset="utf-8">
<style>
@font-face{font-family:"Inter Tight";font-weight:700;src:url(../../fonts/inter-tight-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:400;src:url(../../fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:500;src:url(../../fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:600;src:url(../../fonts/inter-latin-600-normal.woff2) format("woff2")}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000}
.card{position:relative;width:1200px;height:630px;overflow:hidden;font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.86) 0%,rgba(0,0,0,.74) 30%,rgba(0,0,0,.42) 58%,rgba(0,0,0,.12) 100%)}
.text{position:absolute;left:72px;top:0;bottom:0;width:700px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{margin:0 0 14px;font-weight:600;font-size:19px;letter-spacing:-.005em;color:#e8bd6a}
h1{margin:0;max-width:640px;font-family:"Inter Tight",sans-serif;font-weight:700;font-size:74px;line-height:.96;letter-spacing:-.045em;color:#f5f5f7}
.sub{margin:22px 0 0;max-width:560px;font-weight:400;font-size:22px;line-height:1.5;color:#d2d2d7}
.brand{position:absolute;left:72px;bottom:44px;display:flex;align-items:center;gap:12px;font-size:20px}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:#f5f5f7;color:#000;font-family:"Inter",sans-serif;font-weight:600;font-size:14px}
.brand b{font-weight:600;color:#f5f5f7;letter-spacing:-.01em}
.brand .dist{color:#a1a1a6}
</style>
<div class="card">
  <img class="bg" id="bg" alt="">
  <div class="shade"></div>
  <div class="text"><p class="eyebrow" id="eyebrow"></p><h1 id="title"></h1><p class="sub" id="sub"></p></div>
  <div class="brand"><span class="mark">H</span><b>Hanes</b><span class="dist">Distribution</span></div>
</div>
</html>

name: Site checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # Node 24 is the newest LTS Vercel runs (owner rule: newest LTS); 22 stays covered too.
        node: [24, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Enquiry API tests
        run: npm test
      - name: Links, anchors, images and SEO
        run: npm run check
